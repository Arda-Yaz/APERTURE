name: Isolated regression tests

on:
  push:
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run guarded tests without Ollama
        run: python -B tools/run_isolated_tests.py --report .reliability-tmp/ci-tests.json
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-test-report
          path: .reliability-tmp/ci-tests.json
          if-no-files-found: ignore
